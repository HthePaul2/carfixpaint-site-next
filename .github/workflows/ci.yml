name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: carfix
          POSTGRES_USER: carfix
          POSTGRES_PASSWORD: carfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carfix -d carfix"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://carfix:carfix@localhost:5432/carfix
      PAYLOAD_SECRET: ci-only-payload-secret-that-is-long-enough
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
