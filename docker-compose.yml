services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: carfix
      POSTGRES_USER: carfix
      POSTGRES_PASSWORD: carfix
    ports:
      - "5432:5432"
    volumes:
      - carfix_postgres_data:/var/lib/postgresql/data

volumes:
  carfix_postgres_data:
